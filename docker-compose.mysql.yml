name: mirpur-mysql-demo
services:
  mysql:
    image: mysql:8.4
    container_name: mirpur-mysql-demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.mysql.local}
      MYSQL_DATABASE: ${DB_NAME:-mirpur_advising_db}
      MYSQL_USER: ${DB_USERNAME:-mirpur_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.mysql.local}
      TZ: Asia/Dhaka
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: mirpur-database-viewer
    restart: unless-stopped
    profiles: ["viewer"]
    ports:
      - "127.0.0.1:8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-mirpur_app}
      PMA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.mysql.local}
    volumes:
      - ./scripts/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:
