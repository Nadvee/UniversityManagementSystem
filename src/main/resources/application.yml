server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: mirpur-advising
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mirpur_advising_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Dhaka&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 250ms
      connect-timeout: 250ms
      repositories:
        enabled: false
  jackson:
    time-zone: Asia/Dhaka
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  namespace: ${APP_NAMESPACE:mirpur}
  admin-password: ${ADMIN_PASSWORD:admin}
  jwt-secret: ${JWT_SECRET:mirpur-local-demo-secret-change-before-deployment-2026}
  token-hours: 8
  cache-enabled: false
  hold-seconds: 600
  cache-list-minutes: 30
  cache-routine-minutes: 10
teacher:
  max-courses: 4
